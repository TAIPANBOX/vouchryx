name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          check-latest: false
      - name: build and vet
        run: |
          go build ./...
          go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd: $unformatted" >&2
            exit 1
          fi
      # Added the day it caught eleven deprecated crypto calls in
      # agent-stack-go that a local `go vet` and a local test run had both
      # been silent about. A repository doing its own JOSE without this is a
      # repository whose most dangerous file nothing is reading.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
      - name: tests
        run: go test ./... -race
      - name: every scenario is bound to a test
        run: ./scripts/features-are-bound.sh
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh
      - name: every refusal reaches the operator
        run: ./scripts/every-refusal-reaches-the-operator.sh
      - name: the gates have teeth
        run: ./scripts/gates-have-teeth.sh

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          check-latest: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      # gosec flags G101 on TokenType (an OAuth URN, not a secret) and G304 on
      # the operator-config os.ReadFile calls in internal/config (a path from
      # the environment, read once at startup); both are suppressed inline
      # with #nosec and a reason. Nothing else here is suppressed: a new
      # finding is a thing to fix or to argue about in the PR, not to silence.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -quiet ./...
