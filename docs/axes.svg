<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">github.com/TAIPANBOX/vouchryx</text>
<text x="40" y="56" font-size="34" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">vouchryx</text>
<text x="216" y="56" font-size="22" fill="#9aa7b8" font-weight="600">- two switches, different axes</text>
<text x="40" y="84" font-size="15" fill="#9aa7b8">One ends the spend. This one ends the right to act for somebody.</text>
<line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><text x="42" y="138" font-size="12" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">01 &#183; THE MONEY AXIS</text><rect x="40" y="150" width="580" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="60" y="190" font-size="14.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">TokenFuse refuses the call before the provider bills.</text><rect x="56" y="214" width="548" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="214" width="4" height="62" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="74" y="238" font-size="14.5" fill="#e6edf3" font-weight="600">a 402 mid-run</text><text x="74" y="256" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the spend that would have followed simply never happens</text><text x="60" y="320" font-size="13.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Right answer to:</text><rect x="58" y="334" width="146" height="22" rx="11" fill="#1a212c" stroke="#e3b341" stroke-width="1.4"/><text x="131.0" y="349" font-size="11" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">a runaway loop</text><rect x="58" y="370" width="191" height="22" rx="11" fill="#1a212c" stroke="#e3b341" stroke-width="1.4"/><text x="153.5" y="385" font-size="11" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">a fan-out explosion</text><rect x="58" y="406" width="191" height="22" rx="11" fill="#1a212c" stroke="#e3b341" stroke-width="1.4"/><text x="153.5" y="421" font-size="11" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">a budget nobody set</text><text x="60" y="470" font-size="13.5" fill="#ff6b63" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Wrong answer to a compromised delegation:</text><text x="60" y="494" font-size="13" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">the spend is affordable, and the problem is that the</text><text x="60" y="514" font-size="13" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">agent may act for that person at all. Every call it</text><text x="60" y="534" font-size="13" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">makes is inside budget, so nothing trips.</text><text x="60" y="584" font-size="13.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">A ceiling answers HOW MUCH.</text><text x="60" y="606" font-size="13.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">It has nothing to say about WHO FOR.</text><text x="658" y="138" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">02 &#183; THE AUTHORITY AXIS</text><rect x="656" y="150" width="584" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="676" y="190" font-size="14.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Revoking ends the right, wherever the token already is.</text><rect x="672" y="214" width="552" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="672" y="214" width="4" height="62" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="690" y="238" font-size="14.5" fill="#e6edf3" font-weight="600">one call, every enforcement point</text><text x="690" y="256" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">and the token&#x27;s own expiry has no say in it</text><text x="676" y="320" font-size="13.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Right answer to:</text><rect x="674" y="334" width="425" height="22" rx="11" fill="#1a212c" stroke="#4493f8" stroke-width="1.4"/><text x="886.5" y="349" font-size="11" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">a delegation that should never have been made</text><rect x="674" y="370" width="290" height="22" rx="11" fill="#1a212c" stroke="#4493f8" stroke-width="1.4"/><text x="819.0" y="385" font-size="11" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">a person who left this morning</text><rect x="674" y="406" width="371" height="22" rx="11" fill="#1a212c" stroke="#4493f8" stroke-width="1.4"/><text x="859.5" y="421" font-size="11" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">an agent behaving as somebody it is not</text><text x="676" y="470" font-size="13.5" fill="#3fb950" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">What makes it usable in an incident:</text><text x="676" y="494" font-size="13" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">the list carries as_of, so an empty answer and an</text><text x="676" y="514" font-size="13" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">unreachable service are never the same thing to the</text><text x="676" y="534" font-size="13" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">machine reading it, and every revocation names an</text><text x="676" y="554" font-size="13" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">actor and a reason.</text><text x="676" y="596" font-size="13.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Same switch, different axis, and the second</text><text x="676" y="618" font-size="13.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">is the one an incident actually needs.</text></svg>