<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">github.com/TAIPANBOX/vouchryx</text>
<text x="40" y="56" font-size="34" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">vouchryx</text>
<text x="216" y="56" font-size="22" fill="#9aa7b8" font-weight="600">- the delegation plane</text>
<text x="40" y="84" font-size="15" fill="#9aa7b8">A delegation an agent can prove it holds, and that a person can end.</text>
<line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><text x="42" y="138" font-size="12" fill="#9aa7b8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">01 &#183; WHAT GOES IN</text><rect x="40" y="150" width="280" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="56" y="176" width="248" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="176" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">subject_token</text><text x="74" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">from your IdP</text><text x="74" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">user://acme/ada</text><rect x="56" y="254" width="248" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="254" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="278" font-size="14.5" fill="#e6edf3" font-weight="600">actor_token</text><text x="74" y="296" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the agent asking to act</text><text x="74" y="313" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">agent://acme/triage</text><rect x="56" y="332" width="248" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="332" width="4" height="62" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="74" y="356" font-size="14.5" fill="#e6edf3" font-weight="600">DPoP header</text><text x="74" y="374" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">signed by the caller&#x27;s own key,</text><text x="74" y="391" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">RFC 9449</text><text x="60" y="440" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Every value in the config is</text><text x="60" y="459" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">required and none has a</text><text x="60" y="478" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">permissive default. A missing</text><text x="60" y="497" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">one aborts the process and</text><text x="60" y="516" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">names the variable.</text><rect x="58" y="540" width="290" height="22" rx="11" fill="#1a212c" stroke="#ff6b63" stroke-width="1.4"/><text x="203.0" y="555" font-size="11" fill="#ff6b63" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">trusting nothing looks healthy</text><rect x="58" y="576" width="281" height="22" rx="11" fill="#1a212c" stroke="#ff6b63" stroke-width="1.4"/><text x="198.5" y="591" font-size="11" fill="#ff6b63" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">trusting a default issues all</text><text x="358" y="138" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">02 &#183; THE EXCHANGE</text><rect x="356" y="150" width="260" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="372" y="184" font-size="15" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start">POST /v1/token</text><text x="372" y="204" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">RFC 8693 &#183; ES256 &#183; 300s</text><rect x="372" y="222" width="228" height="58" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="372" y="222" width="4" height="58" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="390" y="246" font-size="14.5" fill="#e6edf3" font-weight="600">nested act</text><text x="390" y="264" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">who is acting, for whom</text><rect x="372" y="292" width="228" height="58" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="372" y="292" width="4" height="58" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="390" y="316" font-size="14.5" fill="#e6edf3" font-weight="600">cnf.jkt</text><text x="390" y="334" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the holder key thumbprint</text><rect x="372" y="362" width="228" height="58" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="372" y="362" width="4" height="58" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="390" y="386" font-size="14.5" fill="#e6edf3" font-weight="600">short by default</text><text x="390" y="404" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">300s, capped at 3600</text><rect x="372" y="432" width="228" height="58" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="372" y="432" width="4" height="58" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="390" y="456" font-size="14.5" fill="#e6edf3" font-weight="600">jti recorded</text><text x="390" y="474" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">so one token can be named</text><text x="486" y="546" font-size="13" fill="#ff6b63" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">no introspection endpoint</text><text x="486" y="566" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">it would put this service on the</text><text x="486" y="582" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">path of every enforcement point</text><text x="486" y="598" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">at once, and wardryx answers</text><text x="486" y="614" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">at a 3.2 ms p50</text><text x="654" y="138" font-size="12" fill="#b48cff" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">03 &#183; WHAT COMES BACK</text><rect x="652" y="150" width="268" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="682.0" y="179.0" width="208" height="62" rx="31.0" fill="none" stroke="#b48cff" stroke-width="1.1" opacity="0.3"/><rect x="686.0" y="183.0" width="200" height="54" rx="27.0" fill="#1a212c" stroke="#b48cff" stroke-width="2"/><text x="786" y="209" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">the token</text><text x="786" y="225" font-size="9.5" fill="#b48cff" font-weight="700" text-anchor="middle" letter-spacing="0.5">SHORT-LIVED</text><text x="786" y="268" font-size="12" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">sub: user://acme/ada</text><text x="786" y="288" font-size="12" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">act.sub: agent://acme/triage</text><text x="786" y="308" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">cnf.jkt: 97HAPceq...</text><text x="786" y="328" font-size="12" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">exp: five minutes</text><line x1="668" y1="356" x2="904" y2="356" stroke="#222b38" stroke-width="1" opacity="0.9"/><text x="668" y="386" font-size="13.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Useless to whoever lifts it.</text><text x="668" y="408" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Spending it needs a fresh proof</text><text x="668" y="428" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">from the same key, per request.</text><rect x="668" y="452" width="236" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="668" y="452" width="4" height="62" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="686" y="476" font-size="14.5" fill="#e6edf3" font-weight="600">GET /.well-known/jwks.json</text><text x="686" y="494" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">verification is offline</text><text x="686" y="511" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">and stays offline</text><text x="668" y="552" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">The chain fills the subject of</text><text x="668" y="572" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">the RECORD. Policy and billing</text><text x="668" y="592" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">still want x-fuse-agent-id, and</text><text x="668" y="612" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">that boundary was drawn on purpose.</text><text x="958" y="138" font-size="12" fill="#ff6b63" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">04 &#183; HOW IT ENDS</text><rect x="956" y="150" width="284" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="972" y="176" width="252" height="76" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="972" y="176" width="4" height="76" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="990" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">POST /v1/revoke</text><text x="990" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">by jti for one token, or by</text><text x="990" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">subject for every token it holds</text><text x="976" y="274" font-size="12.5" fill="#e3b341" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">actor and reason are required</text><text x="976" y="294" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">a revocation nobody can attribute</text><text x="976" y="310" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">is an outage, not a decision</text><rect x="972" y="328" width="252" height="76" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="972" y="328" width="4" height="76" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="990" y="352" font-size="14.5" fill="#e6edf3" font-weight="600">GET /v1/revocations</text><text x="990" y="370" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">what enforcement points poll,</text><text x="990" y="387" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">carrying as_of</text><text x="976" y="426" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">an empty list and an unreachable</text><text x="976" y="442" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">service are not the same answer</text><line x1="972" y1="470" x2="1224" y2="470" stroke="#222b38" stroke-width="1" opacity="0.9"/><text x="976" y="500" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">measured 2026-08-27</text><text x="976" y="524" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">proven chain</text><text x="1216" y="524" font-size="13" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="end">200</text><text x="976" y="548" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">after /v1/revoke</text><text x="1216" y="548" font-size="13" fill="#ff6b63" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="end">401</text><text x="976" y="572" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">with the door shut</text><text x="1216" y="572" font-size="13" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="end">200</text><text x="976" y="596" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">nothing was looking at it, which is</text><text x="976" y="612" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">why the door is not cosmetic</text><path d="M 330 401 L 339 410 L 330 419" fill="none" stroke="#4493f8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 626 401 L 635 410 L 626 419" fill="none" stroke="#4493f8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 930 401 L 939 410 L 930 419" fill="none" stroke="#4493f8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>